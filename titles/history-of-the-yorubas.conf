# Title config for the pipeline. To onboard a new book, copy this file to
# titles/<slug>.conf and change the values. Then run: ./pipeline.sh <slug>

TITLE="The History of the Yorubas"
AUTHOR="Samuel Johnson"
DEATH=1901
PUB=1921

# The 1921 first edition (Boston Public Library scan) — NOT the restricted reprints.
SOURCE_URL="https://archive.org/download/historyofyorubas00john/historyofyorubas00john_djvu.txt"

# Strip the repeated running head on this book; keep the safe defaults.
HEADER_PATTERN="^THE HISTORY OF THE YORUBAS$"
CLEAN_FLAGS="--reflow --strip-detected-headers --protect-file tools/yoruba-terms.txt"
